name: Mac catalog

# Signs and publishes a channel catalog that pins one uploaded image, its
# engine and its installer_data.json by digest, and on edge optionally the
# MacBook Neo's own image beside it:
#
#   prepare  no secrets: refuses unless the VM evidence record passed for the
#            image's exact sha256, checks every artifact URL serves its pinned
#            bytes and that each image's installer_data.json admits exactly
#            the Macs the catalog gives it, and builds catalog-<channel>.json
#            enabling every supported M1, M2 and M3 Mac. The Neo image goes in
#            only with a passing hardware install record for its sha256: a new
#            one from the neo-* inputs, or else the one the published edge
#            catalog pins, carried forward with the hardware-evidence.json
#            published beside it and every check run again. When any Neo check
#            or download fails it is left out with a warning, and the catalog
#            offers the M1, M2 and M3 image alone. Only the record of a Neo the
#            catalog carries reaches the signing job
#   release  mac-catalog-sign.yml, shared with the promote workflow: signs in
#            the catalog-release environment (main only, the owner approves
#            each run) after re-checking the evidence, then publishes from a
#            separate job holding a write token and no key. A dry run signs
#            and publishes to a scratch directory only.
#
# Inputs and the evidence record are documented in docs/catalog-release.md.
# A caller (the edge publish trigger) must grant contents: write.

on:
  workflow_call:
    inputs:
      image:
        description: Image name, omarchy-mac-<channel>-<YYYY.MM.DD>-<package set id>
        type: string
        required: true
      payload:
        description: The uploaded image zip as JSON {url, fileName, sizeBytes, sha256, parts?}
        type: string
        required: true
      engine:
        description: The engine as JSON {version, url, fileName, sizeBytes, sha256, downstreamRevision}
        type: string
        required: true
      installer-data:
        description: The image's installer_data.json as JSON {url, fileName, sizeBytes, sha256}
        type: string
        required: true
      evidence:
        description: The VM acceptance evidence record (JSON)
        type: string
        required: true
      installer:
        description: App compatibility as JSON {minimumVersion, latestVersion, downloadURL}; required for engines from v0.9.2-omarchy.18
        type: string
        default: ''
      neo-image:
        description: Edge only, optional - the MacBook Neo's image name
        type: string
        default: ''
      neo-payload:
        description: The uploaded Neo image zip as JSON {url, fileName, sizeBytes, sha256, parts?}
        type: string
        default: ''
      neo-installer-data:
        description: The Neo image's installer_data.json as JSON {url, fileName, sizeBytes, sha256}
        type: string
        default: ''
      neo-evidence:
        description: The Neo image's hardware install record (JSON, scripts/hardware_evidence.py)
        type: string
        default: ''
      channel:
        description: Channel to publish (edge only until promotion is unparked)
        type: string
        default: edge
      dry-run:
        description: Sign and publish to a scratch directory only
        type: boolean
        default: true
    secrets:
      # The sign job reads the catalog-release environment's secret, which a
      # caller must still pass: call with `secrets: inherit`. Callers must be
      # workflows of this repository; catalog_release.py refuses others.
      CATALOG_SIGNING_KEY:
        required: false
    outputs:
      catalog-sha256:
        description: sha256 of the unsigned catalog
        value: ${{ jobs.prepare.outputs.catalog-sha256 }}
      neo:
        description: Whether the Neo image went in (included ...), was dropped (dropped - why) or was not offered
        value: ${{ jobs.prepare.outputs.neo }}
  workflow_dispatch:
    inputs:
      image:
        description: Image name, omarchy-mac-<channel>-<YYYY.MM.DD>-<package set id>
        type: string
        required: true
      payload:
        description: The uploaded image zip as JSON {url, fileName, sizeBytes, sha256, parts?}
        type: string
        required: true
      engine:
        description: The engine as JSON {version, url, fileName, sizeBytes, sha256, downstreamRevision}
        type: string
        required: true
      installer-data:
        description: The image's installer_data.json as JSON {url, fileName, sizeBytes, sha256}
        type: string
        required: true
      evidence:
        description: The VM acceptance evidence record (JSON)
        type: string
        required: true
      installer:
        description: App compatibility as JSON {minimumVersion, latestVersion, downloadURL}; required for engines from v0.9.2-omarchy.18
        type: string
        default: ''
      neo-image:
        description: Edge only, optional - the MacBook Neo's image name
        type: string
        default: ''
      neo-payload:
        description: The uploaded Neo image zip as JSON {url, fileName, sizeBytes, sha256, parts?}
        type: string
        default: ''
      neo-installer-data:
        description: The Neo image's installer_data.json as JSON {url, fileName, sizeBytes, sha256}
        type: string
        default: ''
      neo-evidence:
        description: The Neo image's hardware install record (JSON, scripts/hardware_evidence.py)
        type: string
        default: ''
      channel:
        description: Channel to publish
        type: choice
        options: [edge]
        default: edge
      dry-run:
        description: Sign and publish to a scratch directory only
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Gate and build the catalog
    # Only this repository's runs (a caller elsewhere would check out its own
    # code); sign and publish need this job.
    if: ${{ github.repository == 'omacom/omarchy-mac-installer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      catalog-sha256: ${{ steps.build.outputs.catalog-sha256 }}
      neo: ${{ steps.build.outputs.neo }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Record the inputs
        env:
          IMAGE: ${{ inputs.image }}
          PAYLOAD: ${{ inputs.payload }}
          ENGINE: ${{ inputs.engine }}
          INSTALLER_DATA: ${{ inputs.installer-data }}
          EVIDENCE: ${{ inputs.evidence }}
          INSTALLER: ${{ inputs.installer }}
          NEO_IMAGE: ${{ inputs.neo-image }}
          NEO_PAYLOAD: ${{ inputs.neo-payload }}
          NEO_INSTALLER_DATA: ${{ inputs.neo-installer-data }}
          NEO_EVIDENCE: ${{ inputs.neo-evidence }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          inputs=$RUNNER_TEMP/catalog-inputs
          mkdir -p "$inputs"
          printf '%s\n' "$IMAGE" >"$inputs/image"
          printf '%s\n' "$CHANNEL" >"$inputs/channel"
          printf '%s\n' "$PAYLOAD" >"$inputs/payload.json"
          printf '%s\n' "$ENGINE" >"$inputs/engine.json"
          printf '%s\n' "$INSTALLER_DATA" >"$inputs/installer-data.json"
          printf '%s\n' "$EVIDENCE" >"$inputs/evidence.json"
          [[ -z $INSTALLER ]] || printf '%s\n' "$INSTALLER" >"$inputs/installer.json"
          if [[ -n $NEO_IMAGE ]]; then
            printf '%s\n' "$NEO_IMAGE" >"$inputs/neo-image"
            printf '%s\n' "$NEO_PAYLOAD" >"$inputs/neo-payload.json"
            printf '%s\n' "$NEO_INSTALLER_DATA" >"$inputs/neo-installer-data.json"
            printf '%s\n' "$NEO_EVIDENCE" >"$inputs/neo-evidence.json"
          fi
          {
            git rev-parse HEAD
            openssl version
            python3 --version
            echo "dry_run=$DRY_RUN"
          } | tee "$inputs/toolchain.txt"

      - name: Run the catalog checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_catalog_release.py'

      - name: Build the catalog
        id: build
        run: |
          set -euo pipefail
          inputs=$RUNNER_TEMP/catalog-inputs
          installer=()
          [[ ! -f $inputs/installer.json ]] || installer=(--installer "$inputs/installer.json")
          # Without a new Neo image, the published one carries forward if it
          # still checks out.
          neo=(--carry-neo)
          if [[ -f $inputs/neo-image ]]; then
            neo=(--neo-image "$(<"$inputs/neo-image")" --neo-payload "$inputs/neo-payload.json"
              --neo-installer-data "$inputs/neo-installer-data.json" --neo-evidence "$inputs/neo-evidence.json")
          fi
          python3 scripts/catalog_release.py prepare \
            --channel "$(<"$inputs/channel")" --image "$(<"$inputs/image")" \
            --payload "$inputs/payload.json" --engine "$inputs/engine.json" \
            --installer-data "$inputs/installer-data.json" --evidence "$inputs/evidence.json" \
            "${installer[@]}" "${neo[@]}" --verify-remote --check-live --host github-release \
            --out "$inputs" | tee "$inputs/prepare.log"
          echo "catalog-sha256=$(sed -n 's/^catalog_sha256=//p' "$inputs/prepare.log")" >>"$GITHUB_OUTPUT"
          neo_status=$(sed -n 's/^neo=//p' "$inputs/prepare.log")
          echo "neo=$neo_status" >>"$GITHUB_OUTPUT"
          [[ $neo_status != dropped:* ]] ||
            echo "::warning::the MacBook Neo image is left out; this catalog offers the M1, M2 and M3 image alone: ${neo_status#dropped: }"
          {
            echo "### Catalog for \`$(<"$inputs/image")\`"
            case $neo_status in
              dropped:*) echo "> **Warning:** the MacBook Neo image is left out; this catalog offers the M1, M2 and M3 image alone." ;;
              "included carried "*) echo "The MacBook Neo image is carried forward from the published edge catalog." ;;
              "included new "*) echo "The MacBook Neo image is new, from this run's hardware install record." ;;
            esac
            echo '```'
            cat "$inputs/prepare.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-unsigned
          path: ${{ runner.temp }}/catalog-inputs/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish
    needs: prepare
    uses: ./.github/workflows/mac-catalog-sign.yml
    permissions:
      contents: write # only its publish job, skipped in a dry run, uses it
    with:
      channel: ${{ inputs.channel }}
      catalog-sha256: ${{ needs.prepare.outputs.catalog-sha256 }}
      gate: evidence
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
